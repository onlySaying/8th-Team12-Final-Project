<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b84c9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="18" fill="#14151d"/>

  <!-- ① 스케줄 표 -->
  <text x="28" y="40" fill="#c9c2ff" font-size="15" font-weight="700">① 스케줄 표 · FMainNpcSpawnRow</text>
  <text x="28" y="60" fill="#8f91a3" font-size="12">기획자는 행만 추가 · 수정</text>

  <rect x="28" y="74" width="330" height="250" rx="12" fill="#1d1f2b" stroke="#3a3c52"/>
  <g font-size="11" fill="#8f91a3" font-weight="700">
    <text x="42" y="96">누가 · 언제</text>
    <text x="160" y="96">조건</text>
    <text x="258" y="96">어디</text>
  </g>
  <line x1="40" y1="104" x2="346" y2="104" stroke="#3a3c52"/>

  <g font-size="12" fill="#e8e7f0">
    <text x="42" y="130" font-weight="700">수아 · 1일차</text>
    <text x="160" y="130" fill="#8f91a3">없음 (기본)</text>
    <text x="258" y="130">교실 A</text>
    <text x="258" y="146" fill="#8f91a3" font-size="11">A_Desk</text>
  </g>
  <line x1="40" y1="158" x2="346" y2="158" stroke="#2a2c3c"/>

  <rect x="34" y="162" width="318" height="56" rx="8" fill="#2b2452"/>
  <g font-size="12" fill="#ffffff">
    <text x="42" y="186" font-weight="700">수아 · 1일차</text>
    <text x="160" y="186">호감도 ≥ 신뢰</text>
    <text x="258" y="186">옥상 B</text>
    <text x="258" y="202" fill="#c9c2ff" font-size="11">B_Bench</text>
  </g>

  <g font-size="12" fill="#e8e7f0">
    <text x="42" y="246" font-weight="700">도윤 · 1일차</text>
    <text x="160" y="246">담력 ≥ 5</text>
    <text x="258" y="246">교실 A</text>
    <text x="258" y="262" fill="#8f91a3" font-size="11">A_Corner · 순찰</text>
  </g>
  <line x1="40" y1="274" x2="346" y2="274" stroke="#2a2c3c"/>
  <text x="42" y="300" font-size="11" fill="#8f91a3">조건 · Priority · 시간대 태그 · 시작 AI 상태 · 경로</text>
  <text x="42" y="316" font-size="11" fill="#8f91a3">대화 테이블까지 한 행에 담음</text>

  <path d="M362,200 L402,200" stroke="#8b84c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ② 스포너 -->
  <text x="408" y="40" fill="#c9c2ff" font-size="15" font-weight="700">② 모든 레벨이 같은 계산</text>
  <text x="408" y="60" fill="#8f91a3" font-size="12">NPC마다 맞는 행을 딱 하나 고름</text>

  <rect x="408" y="74" width="270" height="92" rx="12" fill="#1d1f2b" stroke="#3a3c52"/>
  <text x="422" y="98" font-size="12" fill="#e8e7f0" font-weight="700">행 선택 순서</text>
  <g font-size="12" fill="#c8c7d6">
    <text x="422" y="120">조건 있는 행 › Priority 높은 행</text>
    <text x="422" y="140">› 시간대 지정 행 › 표 순서</text>
  </g>
  <text x="422" y="158" font-size="11" fill="#8f91a3">예: 수아 호감도가 '신뢰'면 두 번째 행</text>

  <rect x="408" y="186" width="128" height="78" rx="12" fill="#1d1f2b" stroke="#3a3c52"/>
  <text x="472" y="212" font-size="12" fill="#e8e7f0" font-weight="700" text-anchor="middle">교실 A 스포너</text>
  <text x="472" y="234" font-size="12" fill="#8f91a3" text-anchor="middle">수아 → 다른 레벨</text>
  <text x="472" y="252" font-size="12" fill="#8f91a3" text-anchor="middle">스폰 안 함</text>

  <rect x="550" y="186" width="128" height="78" rx="12" fill="#2b2452" stroke="#8b84c9"/>
  <text x="614" y="212" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">옥상 B 스포너</text>
  <text x="614" y="234" font-size="12" fill="#c9c2ff" text-anchor="middle">수아 → 이 레벨</text>
  <text x="614" y="252" font-size="12" fill="#ffffff" text-anchor="middle">B_Bench에 스폰</text>

  <rect x="408" y="282" width="270" height="42" rx="10" fill="#1a2a24" stroke="#2f6b55"/>
  <text x="543" y="308" font-size="12" fill="#9fe3c4" text-anchor="middle" font-weight="700">→ 한 NPC는 항상 한 곳에만 존재</text>

  <path d="M682,200 L722,200" stroke="#8b84c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ③ 행동트리 -->
  <text x="728" y="40" fill="#c9c2ff" font-size="15" font-weight="700">③ 행동트리 상태</text>
  <text x="728" y="60" fill="#8f91a3" font-size="12">시작 상태는 표, 이후엔 대화가 전환</text>

  <g font-size="12">
    <rect x="728" y="74" width="244" height="44" rx="10" fill="#1d1f2b" stroke="#3a3c52"/>
    <text x="742" y="101" fill="#e8e7f0" font-weight="700">Idle</text>
    <text x="800" y="101" fill="#8f91a3">자리에서 대기 · 앉기</text>

    <rect x="728" y="126" width="244" height="44" rx="10" fill="#1d1f2b" stroke="#3a3c52"/>
    <text x="742" y="153" fill="#e8e7f0" font-weight="700">Patrol</text>
    <text x="800" y="153" fill="#8f91a3">경로 지점 순환</text>

    <rect x="728" y="178" width="244" height="44" rx="10" fill="#1d1f2b" stroke="#3a3c52"/>
    <text x="742" y="205" fill="#e8e7f0" font-weight="700">Guide</text>
    <text x="800" y="205" fill="#8f91a3">플레이어를 기다리며 안내</text>

    <rect x="728" y="230" width="244" height="44" rx="10" fill="#1d1f2b" stroke="#3a3c52"/>
    <text x="742" y="257" fill="#e8e7f0" font-weight="700">Chase</text>
    <text x="800" y="257" fill="#8f91a3">플레이어 추적</text>
  </g>
  <rect x="728" y="282" width="244" height="42" rx="10" fill="#2b2452"/>
  <text x="850" y="301" font-size="11" fill="#ffffff" text-anchor="middle">대화 액션 NpcStartPatrol · NpcStartGuide</text>
  <text x="850" y="316" font-size="11" fill="#c9c2ff" text-anchor="middle">스토리 연출이 AI를 직접 제어</text>

  <!-- 하단: 날이 바뀔 때 -->
  <rect x="28" y="350" width="944" height="94" rx="12" fill="#1d1f2b" stroke="#3a3c52"/>
  <text x="46" y="378" font-size="13" fill="#c9c2ff" font-weight="700">날짜 · 시간대가 바뀌면</text>
  <g font-size="12" fill="#c8c7d6">
    <text x="46" y="402">1. 새로 뽑힌 행이 자리 · 애니메이션 · AI 상태 · 경로 · 대화까지 같으면 그대로 둔다 (IsSamePlacement)</text>
    <text x="46" y="424">2. 달라진 NPC는 전부 먼저 내린 뒤 한꺼번에 다시 세운다 → 깜빡임 · 겹침 없음</text>
  </g>
</svg>
